<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">ONCOLENS cellular morphology animation</title>
  <desc id="desc">A scientific abstract animation of softly glowing cells and pulsing nuclei, representing the cellular measurements studied by the breast cancer classification project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10243a"/>
      <stop offset="0.55" stop-color="#102f42"/>
      <stop offset="1" stop-color="#073c40"/>
    </linearGradient>
    <radialGradient id="cellA">
      <stop offset="0" stop-color="#75f1dd" stop-opacity=".26"/>
      <stop offset=".72" stop-color="#35c9c0" stop-opacity=".13"/>
      <stop offset="1" stop-color="#4edbd1" stop-opacity=".04"/>
    </radialGradient>
    <radialGradient id="nucleus">
      <stop offset="0" stop-color="#ff8db9" stop-opacity=".95"/>
      <stop offset=".7" stop-color="#b45a9a" stop-opacity=".72"/>
      <stop offset="1" stop-color="#8b4b91" stop-opacity=".25"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="#6de8d5" stroke-opacity=".13">
    <path d="M0 80H1200M0 160H1200M0 240H1200"/>
    <path d="M200 0V320M400 0V320M600 0V320M800 0V320M1000 0V320"/>
  </g>
  <g opacity=".75" fill="none" stroke="#61dcca" stroke-width="1.5" stroke-dasharray="5 10">
    <ellipse cx="600" cy="160" rx="430" ry="112">
      <animateTransform attributeName="transform" type="rotate" from="0 600 160" to="360 600 160" dur="48s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="600" cy="160" rx="340" ry="78" transform="rotate(-18 600 160)"/>
  </g>
  <g>
    <g transform="translate(180 150)">
      <circle r="88" fill="url(#cellA)" stroke="#62e5d4" stroke-opacity=".72" stroke-width="2"/>
      <circle r="31" fill="url(#nucleus)" filter="url(#glow)">
        <animate attributeName="r" values="27;34;27" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-43" cy="-34" r="5" fill="#8af4df" opacity=".8"/>
      <circle cx="45" cy="27" r="4" fill="#8af4df" opacity=".65"/>
      <animateTransform attributeName="transform" type="translate" values="180 150;190 142;180 150" dur="9s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(420 94)">
      <circle r="58" fill="url(#cellA)" stroke="#68d8e7" stroke-opacity=".65" stroke-width="2"/>
      <circle r="21" fill="url(#nucleus)" filter="url(#glow)">
        <animate attributeName="r" values="18;24;18" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <animateTransform attributeName="transform" type="translate" values="420 94;430 104;420 94" dur="7s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(660 206)">
      <circle r="74" fill="url(#cellA)" stroke="#62e5d4" stroke-opacity=".72" stroke-width="2"/>
      <circle r="26" fill="url(#nucleus)" filter="url(#glow)">
        <animate attributeName="r" values="22;30;22" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <animateTransform attributeName="transform" type="translate" values="660 206;648 196;660 206" dur="8s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(920 125)">
      <circle r="96" fill="url(#cellA)" stroke="#62e5d4" stroke-opacity=".72" stroke-width="2"/>
      <circle r="35" fill="url(#nucleus)" filter="url(#glow)">
        <animate attributeName="r" values="31;39;31" dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-50" cy="35" r="5" fill="#8af4df" opacity=".7"/>
      <animateTransform attributeName="transform" type="translate" values="920 125;908 137;920 125" dur="10s" repeatCount="indefinite"/>
    </g>
  </g>
  <g fill="#9df5e7" filter="url(#glow)">
    <circle cx="300" cy="55" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="545" cy="65" r="3"><animate attributeName="opacity" values="1;.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="265" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="235" r="3"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" fill="#dffcf7">
    <text x="600" y="286" text-anchor="middle" font-size="13" letter-spacing="4" opacity=".8">CELLULAR MORPHOLOGY • WDBC FEATURE SPACE • ONCOLENS</text>
  </g>
</svg>